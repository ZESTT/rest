<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | مشويات المدينة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        tb: {
                            orange: '#FF5A00',
                            orangeDark: '#E64F00',
                            orangeSoft: '#FFF1E8',
                            black: '#000000',
                            gray: '#F5F5F5',
                            grayLight: '#E5E5E5',
                            grayText: '#666666'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-tb-gray min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl p-8 border border-tb-grayLight shadow-sm">
            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center gap-2.5 mb-6">
                    <div class="w-12 h-12 bg-tb-orange rounded-xl flex items-center justify-center">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                        </svg>
                    </div>
                </a>
                <h1 class="text-2xl font-black text-tb-black mb-2">إنشاء حساب</h1>
                <p class="text-tb-grayText font-semibold text-sm">انضم إلينا الآن</p>
            </div>

            <form id="register-form" class="space-y-5">
                <div>
                    <label class="block mb-2 font-bold text-tb-black text-sm">الاسم</label>
                    <input type="text" id="name" required class="w-full px-4 py-3.5 bg-tb-gray border-2 border-transparent rounded-xl font-semibold text-tb-black placeholder-tb-grayText focus:border-tb-orange focus:bg-white outline-none transition" placeholder="Ahmed ">
                </div>
                <div>
                    <label class="block mb-2 font-bold text-tb-black text-sm">البريد الإلكتروني</label>
                    <input type="email" id="email" required class="w-full px-4 py-3.5 bg-tb-gray border-2 border-transparent rounded-xl font-semibold text-tb-black placeholder-tb-grayText focus:border-tb-orange focus:bg-white outline-none transition" placeholder="email@gmail.com">
                </div>
                <div>
                    <label class="block mb-2 font-bold text-tb-black text-sm">كلمة المرور</label>
                    <input type="password" id="password" required minlength="6" class="w-full px-4 py-3.5 bg-tb-gray border-2 border-transparent rounded-xl font-semibold text-tb-black placeholder-tb-grayText focus:border-tb-orange focus:bg-white outline-none transition" placeholder="6 أحرف على الأقل">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-tb-orange hover:bg-tb-orangeDark text-white py-3.5 rounded-xl font-black text-base transition shadow-sm">
                    إنشاء الحساب
                </button>
            </form>

            <p class="text-center text-tb-grayText text-sm font-semibold mt-6">
                لديك حساب بالفعل؟
                <a href="login.html" class="text-tb-orange font-black hover:underline">سجل دخولك</a>
            </p>
        </div>

        <p class="text-center mt-6">
            <a href="index.html" class="inline-flex items-center gap-2 text-tb-grayText text-sm font-bold hover:text-tb-orange transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                </svg>
                العودة للرئيسية
            </a>
        </p>
    </div>

    <script src="assets/js/config.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'جاري التسجيل...';

            try {
                await apiRequest(API.register, {
                    method: 'POST',
                    body: JSON.stringify({
                        name: document.getElementById('name').value,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                showToast('تم التسجيل بنجاح');
                setTimeout(() => window.location.href = 'login.html', 1000);
            } catch (err) {
                showToast(err.message || 'فشل التسجيل', 'error');
                btn.disabled = false;
                btn.textContent = 'إنشاء الحساب';
            }
        });
    </script>
</body>
</html>
